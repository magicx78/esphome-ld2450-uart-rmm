# RMM (Radar Map Manager) example.
#
# Enabling the `rmm:` block auto-creates sensors whose Home Assistant entity_ids
# match exactly what Radar Map Manager expects, derived from `radar_name`:
#
#   sensor.wohnzimmer_ld2450_target_1_x   sensor.wohnzimmer_ld2450_target_1_y
#   sensor.wohnzimmer_ld2450_target_2_x   sensor.wohnzimmer_ld2450_target_2_y
#   sensor.wohnzimmer_ld2450_target_3_x   sensor.wohnzimmer_ld2450_target_3_y
#   sensor.wohnzimmer_ld2450_presence_target_count
#
# In RMM you then add a radar named:  wohnzimmer_ld2450
#
# `radar_name` may be omitted; it then defaults to the Home Assistant slug of the
# device name (friendly_name, or name). Umlauts are transliterated like HA does
# (friendly_name "Küche LD2450" -> kuche_ld2450).
#
# Validate locally:  esphome config examples/rmm.yaml

# The device name MUST match rmm.radar_name (HA prefixes entity_ids with the
# device name). name: wohnzimmer-ld2450 / friendly_name: Wohnzimmer LD2450 both
# slugify to "wohnzimmer_ld2450".
esphome:
  name: wohnzimmer-ld2450
  friendly_name: Wohnzimmer LD2450

esp32:
  board: esp32dev
  toolchain: platformio
  framework:
    type: arduino

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2450_uart]

uart:
  id: uart_ld2450
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450_uart:
  id: radar
  uart_id: uart_ld2450
  throttle: 200ms
  rmm:
    enabled: true
    radar_name: wohnzimmer_ld2450
    unit: mm
    # Optional extra filters for the six coordinate sensors, e.g. to reduce
    # recorder load in Home Assistant (unchanged values are never re-sent anyway):
    # filters:
    #   - delta: 10

# Presence is convenient in HA but not required by RMM (it uses target_count).
binary_sensor:
  - platform: ld2450_uart
    ld2450_uart_id: radar
    presence:
      name: "Presence"
