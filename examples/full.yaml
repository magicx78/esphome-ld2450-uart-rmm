# Full LD2450 UART example: RMM sensors + all per-target sensors + switches + buttons.
#
# This demonstrates every entity the component can expose. It combines the RMM
# auto-generated sensors (target_N_x/y + presence_target_count) with explicit
# per-target speed/distance/resolution sensors and the configuration controls.
#
# Validate locally:  esphome config examples/full.yaml
# Compile firmware:  esphome compile examples/full.yaml

# Device name must match rmm.radar_name (HA prefixes entity_ids with it).
esphome:
  name: wohnzimmer-ld2450
  friendly_name: Wohnzimmer LD2450

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2450_uart]

uart:
  id: uart_ld2450
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2450_uart:
  id: radar
  uart_id: uart_ld2450
  throttle: 200ms
  rmm:
    enabled: true
    radar_name: wohnzimmer_ld2450
    unit: mm

sensor:
  - platform: ld2450_uart
    ld2450_uart_id: radar
    # Extra per-target detail beyond what RMM needs (x/y come from rmm: above).
    target_1:
      speed:
        name: "Target 1 Speed"
      distance:
        name: "Target 1 Distance"
      angle:
        name: "Target 1 Angle"
      resolution:
        name: "Target 1 Resolution"
    target_2:
      speed:
        name: "Target 2 Speed"
      distance:
        name: "Target 2 Distance"
      angle:
        name: "Target 2 Angle"
    target_3:
      speed:
        name: "Target 3 Speed"
      distance:
        name: "Target 3 Distance"
      angle:
        name: "Target 3 Angle"

binary_sensor:
  - platform: ld2450_uart
    ld2450_uart_id: radar
    presence:
      name: "Presence"
    target_1:
      present:
        name: "Target 1 Present"
      moving:
        name: "Target 1 Moving"
    target_2:
      present:
        name: "Target 2 Present"
      moving:
        name: "Target 2 Moving"
    target_3:
      present:
        name: "Target 3 Present"
      moving:
        name: "Target 3 Moving"

switch:
  - platform: ld2450_uart
    ld2450_uart_id: radar
    bluetooth:
      name: "LD2450 Bluetooth"
    multi_target:
      name: "Multi-Target Tracking"

button:
  - platform: ld2450_uart
    ld2450_uart_id: radar
    restart:
      name: "Restart LD2450"
    factory_reset:
      name: "Factory Reset LD2450"
